  .contact span{color:#c7d1dd}

  .ctlgroup{display:flex; gap:4px; background:var(--ctl-bg); border:1px solid var(--ctl-br);

  .ctlgroup button{

    color:var(--ctl-fg); background:transparent; border:0; border-radius:16px;
    padding:4px 11px; cursor:pointer; transition:background .16s ease, color .16s ease;

  .ctlgroup button[aria-pressed="true"]{background:var(--brass); color:#12202f}

    .body{display:flex; flex-direction:column}

    aside{order:2; padding:18px 34px; border-right:none; border-top:1px solid var(--line)}

    .tail{gap:0 26px}

    h2{break-after:avoid}

</style>
</head>

const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };

let state = { lang:"en", theme:"light" };

const SUN = '<svg viewBox="0 0 24 24"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zm0 2a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zm0-18a1 1 0 011 1v2a1 1 0 11-2 0V2a1 1 0 011-1zm10 11a1 1 0 01-1 1h-2a1 1 0 110-2h2a1 1 0 011 1zM5 12a1 1 0 01-1 1H2a1 1 0 110-2h2a1 1 0 011 1zm14.07 7.07a1 1 0 01-1.41 0l-1.42-1.42a1 1 0 011.41-1.41l1.42 1.42a1 1 0 010 1.41zM7.76 7.76a1 1 0 01-1.41 0L4.93 6.34a1 1 0 011.41-1.41l1.42 1.42a1 1 0 010 1.41zm11.31-2.83a1 1 0 010 1.41L17.66 7.76a1 1 0 11-1.41-1.41l1.41-1.42a1 1 0 011.41 0zM7.76 16.24a1 1 0 010 1.41l-1.42 1.42a1 1 0 01-1.41-1.41l1.42-1.42a1 1 0 011.41 0z"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21.53 15.93A9 9 0 018.07 2.47a9.5 9.5 0 1013.46 13.46z"/></svg>';
const PRINTER = '<svg viewBox="0 0 24 24"><path d="M7 3h10v4H7V3zm12 6H5a3 3 0 00-3 3v5h4v4h12v-4h4v-5a3 3 0 00-3-3zm-3 10H8v-5h8v5z"/></svg>';

function buildLangButtons(){
  const wrap = $("langs"); wrap.innerHTML = "";
  LANGS.forEach(([code,label])=>{
    const b = el("button", null, label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(code === state.lang));
    b.setAttribute("aria-label", label);
    b.addEventListener("click", ()=>{ state.lang = code; render(); });
    wrap.appendChild(b);
  });
}

function setTheme(t){
  state.theme = t;
  document.documentElement.setAttribute("data-theme", t);
  const d = CV[state.lang].ui;
  $("themeBtn").innerHTML = (t === "light" ? MOON : SUN) + "<span>" + (t === "light" ? d.dark : d.light) + "</span>";
  $("themeBtn").setAttribute("aria-label", t === "light" ? d.dark : d.light);
}

function render(){
  const d = CV[state.lang];
  document.documentElement.lang = state.lang;
  document.title = d.docTitle;

  $("tagline").textContent = d.tagline;
  $("roleline").innerHTML = d.roleline;

  $("contact").innerHTML =

    '<span>📞 ' + d.contact.phone + '</span>' +
    '<a href="mailto:goncalocsmn@gmail.com">✉ goncalocsmn@gmail.com</a>' +
    '<a href="https://www.linkedin.com/in/moreiraneves" target="_blank" rel="noopener">linkedin.com/in/moreiraneves</a>';

  $("h-results").textContent  = d.h.results;
  $("h-caps").textContent     = d.h.caps;
  $("h-edu").textContent      = d.h.edu;
  $("h-certs").textContent    = d.h.certs;

  $("h-exp").textContent      = d.h.exp;

  $("wins").innerHTML = d.wins.map(w =>

  $("skills").innerHTML = d.skills.map(g =>

  $("edu").innerHTML = d.edu.map(e =>

  $("certs").innerHTML = d.certs.map(c => '<li>' + c + '</li>').join("");

  $("pubs").innerHTML = d.pubs.map(p =>

  $("langlist").innerHTML = d.langs.map(l =>
    '<div class="lang"><b style="font-weight:600">' + l[0] + '</b><span>' + l[1] + '</span></div>').join("");

  $("profile").innerHTML = d.profile.map(p => '<p>' + p + '</p>').join("");

  $("jobs").innerHTML = d.jobs.map(j => {
    let h = '<div class="job"><div class="top">' +
      '<div class="title">' + j.title + ' · <span class="co">' + j.co + '</span></div>' +
      '<div class="meta">' + j.meta + '</div></div>';
    if (j.desc) h += '<div class="desc">' + j.desc + '</div>';
    if (j.b && j.b.length) h += '<ul>' + j.b.map(x => '<li>' + x + '</li>').join("") + '</ul>';
    if (j.v && j.v.length) {
      h += '<div class="vent">' + j.v.map(v =>
        '<div class="vrow"><div class="vtitle">' + v[0] + ' · <span class="co2">' + v[1] + '</span> ' +
        '<span class="vmeta">' + v[2] + '</span></div><div class="vdesc">' + v[3] + '</div></div>').join("") + '</div>';
    }
    return h + '</div>';
  }).join("");

  $("foot").textContent = d.foot;

  $("printBtn").innerHTML = PRINTER + '<span>' + d.ui.print + '</span>';
  $("printBtn").setAttribute("aria-label", d.ui.print);

  buildLangButtons();
  setTheme(state.theme);
}
